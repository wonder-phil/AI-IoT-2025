<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script> 
    <!-- <script src="../js/aframe-master.min.js"></script> -->
  </head>
  <body>
	<script>
      document.addEventListener('DOMContentLoaded', () => {
          const isLocal = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
          const src = isLocal
            ? 'http://localhost:8000/p04/IMAGES/mars-surface.avif'
            : './IMAGES/mars-surface.avif';

          const img = document.getElementById('mars');
          img.setAttribute('src', src);        // set it

            const imageSource = isLocal
            ? 'http://localhost:8000/p01/IMAGES/heic2007a.jpg'
            : '../p01/IMAGES/heic2007a.jpg';

          const imgBackground = document.getElementById('nebula');
            imgBackground.setAttribute('src', imageSource);  

          // once assets are ready, use it
          document.querySelector('a-assets').addEventListener('loaded', () => {
            document.getElementById('mars')
              .setAttribute('material', 'src: #mars');
            document.getElementById('mySky')
              .setAttribute('material', 'src: #nebula');
          });
        });
    </script>
    <a-scene>
		<a-assets>
        	<img id="mars" crossorigin="anonymous">
          <img id="nebula" crossorigin="anonymous">
    </a-assets>
    <a-sky id="mySky" src="#nebula" position="-2.5  0 -1.5"></a-sky>
		<a-entity position="0 0 -5" rotation="0 0 0" 
			animation="property: rotation; to: 0 -360 0; 
			easing: linear; loop: true; dur:10000 ">
			<a-sphere position="0 2 -3" src="#mars" 
                animation="property: rotation; to: 0 360 0; 
				        easing: linear; loop: true; dur:1000 "
            ></a-sphere>
		</a-entity>
    </a-scene>
  </body>
</html>
