<html>
  <head>
    <!-- <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script> -->
	 <script src="../js/aframe-master.min.js"></script>
  </head>
  <body>
	<script>
     document.addEventListener('DOMContentLoaded', () => {
          const isLocal = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
          const src = isLocal
            ? 'http://localhost:8000/p04/IMAGES/mars-surface.avif'
            : './IMAGES/mars-surface.avif';

          const img = document.getElementById('mars');
          img.setAttribute('src', src);        // set it

          // once assets are ready, use it
          document.querySelector('a-assets').addEventListener('loaded', () => {
            document.getElementById('mars')
              .setAttribute('material', 'src: #mars');
          });
        });
		</script>
    <a-scene>
      <!-- <a-sphere  id="PGB sphere" position="0 2 -1.5" radius="1" rotation="0 0 0" color="blue"></a-sphere> -->
	  <a-assets>
			<img id="mars" src="#mars" crossorigin="anonymous">
	  </a-assets>
	  <a-sphere  id="PGB-sphere" radius="0.5"
							  position="0 2 -5.5" 
							  transparent="true"
							  blending="additive"
							  src="#mars"
							  animation="property: rotation; to: 0 360 0; loop: true; dur:1000 "
							   ></a-sphere>
							 
		<a-box	id="PGB Box" 
				position="0 2 -5.5"
				
				transparent="true"
				blending="additive"
				color="gray"></a-box>
							 
    </a-scene>
  </body>
</html>

<!-- "additive" subtractive none multiply normal -->
