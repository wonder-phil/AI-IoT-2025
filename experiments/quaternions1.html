<html>
  <head>
    <!--  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>  -->
    <script src="../js/aframe.min.js"></script> 
  </head>
  <body>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
          const isLocal = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
          const src = isLocal
            ? 'http://localhost:8000/p01/IMAGES/heic2007a.jpg'
            : './IMAGES/heic2007a.jpg';

          const img = document.getElementById('nebula');
          img.setAttribute('src', src);        // set it

          // once assets are ready, use it
          document.querySelector('a-assets').addEventListener('loaded', () => {
            document.getElementById('mySky')
              .setAttribute('material', 'src: #nebula');
          });
        });
      </script>
<script>
  AFRAME.registerComponent('quat-rotate', {
    init: function () {
      // Define a quaternion: axis-angle rotation (e.g., around the Y-axis by 90 degrees)
      // w = cos(angle/2), (x,y,z) = axis * sin(angle/2)
      var targetRotation = new THREE.Quaternion(0, 0.7071, 0, 0.7071);
      
      // Apply to the A-Frame entity's underlying 3D object
      this.el.object3D.quaternion.copy(targetRotation);
    }
  });
</script>

<a-scene>
  <a-box position="0 1 -3" color="#4CC3D9" quat-rotate></a-box>
</a-scene>

</body>
</html>
